<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单高德地图测试</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 400px; border: 2px solid #ccc; margin: 20px 0; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .loading { background: #e3f2fd; color: #1976d2; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <h1>简单高德地图测试</h1>
    
    <div class="status loading" id="status">正在加载...</div>
    
    <div id="map"></div>
    
    <div>
        <h3>测试信息</h3>
        <p><strong>API Key:</strong> 6f26c9822c56885edcac606bf196598a</p>
        <p><strong>容器ID:</strong> map</p>
        <p><strong>容器尺寸:</strong> <span id="container-info">计算中...</span></p>
    </div>

    <script>
        const AMAP_KEY = '6f26c9822c56885edcac606bf196598a';
        const statusEl = document.getElementById('status');
        const containerInfoEl = document.getElementById('container-info');
        
        function updateStatus(message, type = 'loading') {
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        function updateContainerInfo() {
            const mapEl = document.getElementById('map');
            if (mapEl) {
                const rect = mapEl.getBoundingClientRect();
                containerInfoEl.textContent = `${rect.width}x${rect.height} (${mapEl.offsetWidth}x${mapEl.offsetHeight})`;
            }
        }
        
        // 更新容器信息
        updateContainerInfo();
        
        // 加载高德地图脚本
        function loadAMapScript() {
            return new Promise((resolve, reject) => {
                if (window.AMap) {
                    console.log('AMap already loaded');
                    resolve(window.AMap);
                    return;
                }

                console.log('Loading AMap script...');
                updateStatus('正在加载高德地图脚本...', 'loading');
                
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.async = true;
                script.src = `https://webapi.amap.com/maps?v=1.4.15&key=${AMAP_KEY}`;
                
                script.onload = () => {
                    console.log('AMap script loaded successfully');
                    if (window.AMap) {
                        updateStatus('脚本加载成功，正在创建地图...', 'success');
                        resolve(window.AMap);
                    } else {
                        reject(new Error('AMap not available after script load'));
                    }
                };
                
                script.onerror = (error) => {
                    console.error('Failed to load AMap script:', error);
                    reject(error);
                };
                
                document.head.appendChild(script);
            });
        }

        // 初始化地图
        async function initMap() {
            try {
                updateStatus('开始初始化地图...', 'loading');
                
                const AMap = await loadAMapScript();
                console.log('AMap loaded:', AMap);
                
                const mapEl = document.getElementById('map');
                console.log('Map container:', mapEl);
                console.log('Map container dimensions:', mapEl.offsetWidth, mapEl.offsetHeight);
                
                if (!mapEl) {
                    throw new Error('Map container element not found');
                }
                
                if (mapEl.offsetWidth === 0 || mapEl.offsetHeight === 0) {
                    throw new Error('Map container has zero dimensions');
                }
                
                updateStatus('正在创建地图实例...', 'loading');
                
                const map = new AMap.Map('map', {
                    zoom: 5,
                    center: [108.3200, 22.8240], // 南宁
                    mapStyle: 'amap://styles/normal'
                });

                console.log('Map instance created:', map);
                updateStatus('地图创建成功！', 'success');
                
                // 添加一个标记点
                const marker = new AMap.Marker({
                    position: [108.3200, 22.8240],
                    title: '南宁'
                });
                marker.setMap(map);
                
                console.log('Marker added to map');
                
            } catch (error) {
                console.error('Map initialization failed:', error);
                updateStatus('地图初始化失败: ' + error.message, 'error');
            }
        }

        // 等待页面完全加载后开始测试
        window.addEventListener('load', () => {
            console.log('Page loaded, starting map test...');
            updateStatus('页面加载完成，开始测试...', 'loading');
            
            // 延迟一点时间确保DOM完全准备好
            setTimeout(() => {
                updateContainerInfo();
                initMap();
            }, 100);
        });
    </script>
</body>
</html>
