<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高德地图API测试</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 400px; border: 1px solid #ccc; }
        .info { background: #f0f0f0; padding: 15px; margin: 20px 0; border-radius: 5px; }
        .error { background: #ffe6e6; color: #cc0000; }
        .success { background: #e6ffe6; color: #006600; }
    </style>
</head>
<body>
    <h1>高德地图API测试页面</h1>
    
    <div class="info">
        <h3>测试信息</h3>
        <p><strong>API Key:</strong> 6f26c9822c56885edcac606bf196598a</p>
        <p><strong>测试目的:</strong> 验证高德地图JavaScript API是否能正常加载和显示</p>
    </div>

    <div id="map"></div>
    
    <div id="status" class="info">
        <h3>加载状态</h3>
        <p id="status-text">正在加载...</p>
    </div>

    <div id="console" class="info">
        <h3>控制台日志</h3>
        <div id="log-content"></div>
    </div>

    <script>
        const AMAP_KEY = '6f26c9822c56885edcac606bf196598a';
        const statusEl = document.getElementById('status-text');
        const logEl = document.getElementById('log-content');
        
        function log(message) {
            console.log(message);
            const logItem = document.createElement('div');
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(logItem);
        }

        function updateStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.parentElement.className = `info ${isError ? 'error' : 'success'}`;
        }

        // 加载高德地图脚本
        function loadAMapScript() {
            return new Promise((resolve, reject) => {
                if (window.AMap) {
                    log('AMap already loaded');
                    resolve(window.AMap);
                    return;
                }

                log('Loading AMap script...');
                const script = document.createElement('script');
                script.type = 'text/javascript';
                script.async = true;
                script.src = `https://webapi.amap.com/maps?v=1.4.15&key=${AMAP_KEY}&plugin=AMap.Driving`;
                
                script.onload = () => {
                    log('AMap script loaded successfully');
                    if (window.AMap) {
                        resolve(window.AMap);
                    } else {
                        reject(new Error('AMap not available after script load'));
                    }
                };
                
                script.onerror = (error) => {
                    log('Failed to load AMap script: ' + error);
                    reject(error);
                };
                
                document.head.appendChild(script);
            });
        }

        // 初始化地图
        async function initMap() {
            try {
                updateStatus('正在加载高德地图脚本...');
                const AMap = await loadAMapScript();
                
                updateStatus('正在创建地图实例...');
                const map = new AMap.Map('map', {
                    zoom: 5,
                    center: [108.3200, 22.8240], // 南宁
                    mapStyle: 'amap://styles/normal'
                });

                log('Map instance created successfully');
                updateStatus('地图加载成功！', false);
                
                // 添加一个标记点
                const marker = new AMap.Marker({
                    position: [108.3200, 22.8240],
                    title: '南宁'
                });
                marker.setMap(map);
                
                log('Marker added to map');
                
            } catch (error) {
                log('Map initialization failed: ' + error.message);
                updateStatus('地图加载失败: ' + error.message, true);
            }
        }

        // 开始测试
        log('Starting AMap test...');
        initMap();
    </script>
</body>
</html>
